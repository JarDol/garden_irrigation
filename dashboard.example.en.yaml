title: Garden - Irrigation
icon: mdi:sprinkler-variant
views:
  # ============================================================
  # TAB 1: MAIN
  # ============================================================
  - title: Main
    path: main
    icon: mdi:water-pump
    cards:
      - type: entities
        title: Control & status
        show_header_toggle: false
        entities:
          - entity: switch.garden_irrigation_irrigation_paused
            name: Global switch (holiday mode)
          - entity: switch.garden_irrigation_dynamic_mad_enabled
            name: Dynamic MAD adjustment (FAO-56)
          - entity: switch.garden_irrigation_allow_simultaneous_watering
            name: Allow simultaneous watering of zones
          - entity: sensor.garden_irrigation_sequence_start_time
            name: Next sequence start
          - entity: sensor.garden_irrigation_et0_yesterday
            name: ET0 (yesterday)
          - entity: binary_sensor.garden_irrigation_any_zone_rain_paused
            name: Paused due to rain

      - type: entities
        title: Water usage - whole garden
        show_header_toggle: false
        entities:
          - entity: sensor.garden_irrigation_total_water_today
            name: Today
          - entity: sensor.garden_irrigation_total_water_last
            name: During last watering
          - entity: sensor.garden_irrigation_total_water_month
            name: This month
          - entity: sensor.garden_irrigation_total_water_year
            name: This year

      - type: entities
        title: Actions
        show_header_toggle: false
        entities:
          - entity: button.garden_irrigation_approve_all
            name: Approve all pending zones
          - entity: button.garden_irrigation_schedule_sunrise_sequence
            name: Schedule sequence before sunrise

