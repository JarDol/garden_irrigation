      - type: markdown
        title: Reference - new planting / reseeding (watering frequency and timing)
        content: |
          While a zone is in a growth stage (see the "New planting / reseeding"
          card on the Zones tab), it does **not** use the Kc/root depth/MAD
          table above - instead it waters on its OWN fixed schedule, tied to
          the lead plant selected when it was started:

          | Plant | Germination: days / x per day / mm water | Young plants: days / x per day / mm water |
          |---|---|---|
          | Ornamental lawn | 14 / 2x / 1.0 mm | 21 / 1x / 1.6 mm |
          | Leafy vegetables | 10 / 2x / 1.0 mm | 21 / 1x / 2.0 mm |
          | Root vegetables | 14 / 2x / 1.0 mm | 21 / 1x / 2.0 mm |
          | Strawberries / wild strawberries | 10 / 2x / 1.0 mm | 21 / 1x / 1.6 mm |
          | Roses | 14 / 1x / 1.6 mm | 30 / 1x / 2.0 mm |
          | Garden perennials (general) | 10 / 1x / 1.2 mm | 21 / 1x / 2.0 mm |
          | Hydrangeas | 14 / 1x / 1.6 mm | 30 / 1x / 2.0 mm |
          | Hostas | 10 / 1x / 1.2 mm | 21 / 1x / 1.6 mm |
          | Tall ornamental grasses | 14 / 1x / 1.2 mm | 21 / 1x / 2.0 mm |
          | Ornamental deciduous shrubs | 14 / 1x / 1.6 mm | 30 / 1x / 2.0 mm |
          | Formal deciduous hedge | 14 / 1x / 1.6 mm | 30 / 1x / 2.0 mm |
          | Coniferous hedge / shrubs | 14 / 1x / 1.6 mm | 35 / 1x / 2.0 mm |
          | Large conifers (fir, pine, spruce) | 14 / 1x / 2.0 mm | 45 / 1x / 3.0 mm |
          | Yews | 14 / 1x / 1.6 mm | 35 / 1x / 2.0 mm |
          | Creeping conifers | 14 / 1x / 1.6 mm | 30 / 1x / 2.0 mm |
          | Mature deciduous trees | 14 / 1x / 2.0 mm | 45 / 1x / 3.0 mm |
          | Fruit trees | 14 / 1x / 2.0 mm | 45 / 1x / 3.0 mm |
          | Potted plants (general) | 7 / 2x / 0.6 mm | 14 / 1x / 1.0 mm |

          The "mm water" column is a FIXED, physical amount of water per
          watering (mm depth = liters per m² of zone area) - NOT valve time.
          How long that actually takes is calculated SEPARATELY for each zone
          from its own current application rate (irrigation type -
          sprinklers/micro-sprinklers/drip - plus any self-learning from a
          flow meter, see the "Default application rate by irrigation type"
          table below) and its area. If the zone has a flow meter (and
          "Live-adjust runtime from flow meter reading" isn't disabled), the
          valve closes exactly once that amount of water has been delivered -
          NOT after the estimated time elapses.

          **What time of day does this happen, and how much water?** The FIRST
          watering EVERY day starts at the same time as the main sequence
          (sunrise or a fixed clock time - whatever is set in "Start mode", the
          "Operating mode and watering start" card in the integration's
          configuration). Its dose covers the deficit accrued since the
          previous day - but never more than the stage's mm water from the
          table above would deliver, so it never dumps one large dose onto
          shallow, germinating roots (e.g. if the growth stage was started
          on a zone that already had a sizeable deficit). If the deficit is
          zero (e.g. rain covered it), the full, short dose still runs anyway
          - that keeps the surface moist for germinating seeds, independent of
          the deeper water balance. Later waterings on the same day (at
          frequency >1x/day, e.g. 2x during lawn germination) are unchanged:
          fixed, short dose, spaced (24h / frequency) apart from the previous one -
          e.g. +12h at 2x/day - independent of the deficit, purely to keep the
          surface consistently moist. Exception: the day the growth stage is
          STARTED - the first watering runs immediately after starting
          (switch/`start_new_planting` service), without waiting for
          sunrise/the set time; syncing with the main sequence kicks in from
          the SECOND day onward. The amount delivered and the exact time of the
          next watering are visible live in the `ostatnie_podlewanie_mm` and
          `kolejne_podlewanie` attributes of
          `sensor.garden_irrigation_<zone>_growth_stage` (the "Growth stage"
          card on the Zones tab).

      - type: markdown
        title: Reference - default application rate by irrigation type
        content: |
          | Irrigation type | Default rate | How it's calculated |
          |---|---|---|
          | Sprinklers | 12.0 mm/h | Fixed table value |
          | Micro-sprinklers | 6.0 mm/h | Fixed table value |
          | Drip line | no fixed value - always calculated | (length / spacing) × emitter flow rate, divided by the effective area (length × 0.4 m wetted strip) |
          | Individual emitters | no fixed value - always calculated | (number of emitters × emitter flow rate), divided by the zone area |

          This is only a **starting point** in the "Application rate" field when configuring a
          zone (as long as "Auto-calculate" is enabled) - it can always be overridden manually,
          and if the zone has a flow meter with "Learn from flow meter" enabled, it will
          eventually be corrected automatically based on real measurements anyway.

      - type: markdown
        title: How the water balance is calculated (reminder)
        content: |
          - **ETc (daily water use by the plant)** = ET0 × Kc
          - **Soil water deficit** grows by ETc, shrinks by measured rainfall and delivered water
          - **Watering threshold** = (soil AWC × root depth / 1000) × MAD
          - With several plants in one zone: **Kc and root depth** - from the most demanding
            plant, **MAD** - from the most sensitive one (the lowest threshold)
