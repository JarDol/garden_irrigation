      - type: button
        name: Open integration configuration
        icon: mdi:cog
        tap_action:
          action: navigate
          navigation_path: /config/integrations/integration/garden_irrigation

      - type: markdown
        title: New planting / reseeding - how to start it
        content: >
          **Easiest via the integration configuration** (since v1.17.2): the
          "Open integration configuration" button above -> on the integration
          card click **Configure** (gear icon / three dots) -> pick
          **"New planting / reseeding"** from the main menu -> toggle the
          switch for a zone and pick the plants (only those already assigned
          to that zone) -> **Save**. The zone immediately moves into the
          "Germination" stage, then automatically "Young plants", until it
          returns to standard. The toggle always shows the zone's real state -
          turning it off for a zone with an active growth stage **cancels it**
          and returns to standard right away. NOTE: HA doesn't support linking
          directly to a specific wizard step - the button only opens the
          integration list, "Configure" and picking "New planting /
          reseeding" have to be clicked manually every time.


          **Alternatively** (e.g. from automations) - services called via
          **Developer Tools -> Actions**:


          - `garden_irrigation.start_new_planting` - fields: `zone_id` (zone
          number) and `plant_keys` (list of plants already assigned to that
          zone)

          - `garden_irrigation.cancel_new_planting` - field: `zone_id` -
          manually, immediately ends the growth stage (e.g. a mistake when
          picking plants)


          Live status is shown in the "Growth stage" sensor above, in every
          zone card.

  # ============================================================
  # TAB 4: INFO (live zone parameters + static reference dictionary)
  # ============================================================
  - title: Info
    path: info
    icon: mdi:information-outline
    cards:
      - type: markdown
        title: Weather inputs (verification)
        content: >
          **ET0 method (yesterday):** {{ states('sensor.garden_irrigation_weather_inputs') }}

          **Now (live sensor readings):**
          - Temperature: {{ state_attr('sensor.garden_irrigation_weather_inputs', 'teraz_temperatura_c') }} °C
          - Solar radiation: {{ state_attr('sensor.garden_irrigation_weather_inputs', 'teraz_naslonecznienie_wm2') }} W/m²
          - Humidity: {{ state_attr('sensor.garden_irrigation_weather_inputs', 'teraz_wilgotnosc_pct') }} %
          - Wind: {{ state_attr('sensor.garden_irrigation_weather_inputs', 'teraz_wiatr_ms') }} m/s

          **Yesterday (ET0 inputs):**
          {% set w = state_attr('sensor.garden_irrigation_weather_inputs', 'wczoraj') %}
          {% if w %}
          - Date: {{ w.data }}
          - Tmax / Tmin / Tmean: {{ w.tmax_c }} / {{ w.tmin_c }} / {{ w.tmean_c }} °C
          - Average solar radiation: {{ w.naslonecznienie_srednie_wm2 }} W/m² ({{ w.liczba_probek_naslonecznienia }} samples)
          - Average wind: {{ w.wiatr_sredni_ms }} m/s ({{ w.liczba_probek_wiatru }} samples)
          - Average humidity: {{ w.wilgotnosc_srednia_pct }} % ({{ w.liczba_probek_wilgotnosci }} samples)
          {% else %}
          - No snapshot saved yet (will appear after the next midnight)
          {% endif %}

          **Rain:**
          - Forecast (freshest reading): {{ state_attr('sensor.garden_irrigation_weather_inputs', 'prognoza_opadu_mm') }} mm (fetched: {{ state_attr('sensor.garden_irrigation_weather_inputs', 'prognoza_opadu_pobrana_o') }})
          - **Forecast maximum over the last {{ state_attr('sensor.garden_irrigation_weather_inputs', 'prognoza_okno_min') }} min (this is what actually decides the skip):** {{ state_attr('sensor.garden_irrigation_weather_inputs', 'prognoza_max_w_oknie_mm') }} mm
          - Total rain counter: {{ state_attr('sensor.garden_irrigation_weather_inputs', 'opad_licznik_calkowity_mm') }} mm ({{ state_attr('sensor.garden_irrigation_weather_inputs', 'opad_licznik_encja') }})
          - **Measured today (since midnight):** {{ state_attr('sensor.garden_irrigation_weather_inputs', 'opad_zmierzony_dzisiaj_mm') }} mm - actually subtracted from every zone's deficit

          **Forecast taken into account:**
          {% set noc = state_attr('sensor.garden_irrigation_weather_inputs', 'prognoza_nocna') %}
          {% if noc %}
          - Last nightly recalculation ({{ noc.data }}): {{ noc.prognoza_mm }} mm (threshold: {{ noc.prog_mm }} mm) - {{ 'held back' if noc.wstrzymano else 'no hold' }}
          {% else %}
          - No nightly snapshot saved yet (will appear after the next midnight)
          {% endif %}
          {% set ost = state_attr('sensor.garden_irrigation_weather_inputs', 'prognoza_ostatnie_sprawdzenie') %}
          {% if ost %}
          - Last check ({{ ost.zrodlo }}, {{ ost.kiedy }}): {{ ost.prognoza_mm }} mm (threshold: {{ ost.prog_mm }} mm) - {{ 'held back' if ost.wstrzymano else 'no hold' }}
          {% else %}
          - No check yet
          {% endif %}

      - type: markdown
        title: Active parameters in your zones (live)
        content: |
          {%- set zones = {
            'zone_01': 'Zone 1',
            'zone_02': 'Zone 2',
            'zone_03': 'Zone 3',
            'zone_04': 'Zone 4',
            'zone_05': 'Zone 5',
            'zone_06': 'Zone 6'
          } -%}
          {%- for slug, name in zones.items() %}
          {%- set param = 'sensor.garden_irrigation_' ~ slug ~ '_soil_plant_parameters' %}
          {%- set kc = 'sensor.garden_irrigation_' ~ slug ~ '_kc_value' %}
          {%- set mad = 'sensor.garden_irrigation_' ~ slug ~ '_mad_threshold' %}

          ### {{ name }}
          - **Soil:** {{ state_attr(param, 'gleba') }}
          - **Plants:** {{ state_attr(param, 'wybrane_rosliny') | join(', ') if state_attr(param, 'wybrane_rosliny') else 'no data' }}
          - **Adopted Kc:** {{ states(kc) }} (from: {{ state_attr(kc, 'przyjete_od') }})
          - **Adopted MAD threshold:** {{ states(mad) }} (from: {{ state_attr(mad, 'przyjete_od') }})
          - **Available water in soil:** {{ state_attr(param, 'dostepna_woda_gleby_mm_na_m') }} mm/m depth
          {%- endfor %}

      - type: markdown
        title: Reference - soil types (water capacity)
