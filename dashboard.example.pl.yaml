      - type: button
        name: Otwórz konfigurację integracji
        icon: mdi:cog
        tap_action:
          action: navigate
          navigation_path: /config/integrations/integration/garden_irrigation

      - type: markdown
        title: Dosiewka / nowe nasadzenie - jak uruchomić
        content: >
          **Najprościej przez konfigurację integracji** (od v1.17.2): przycisk
          "Otwórz konfigurację integracji" powyżej -> na karcie integracji
          kliknij **Konfiguruj** (ikona koła zębatego / trzy kropki) -> z menu
          głównego wybierz **"Dosiewka / nowe nasadzenie"** -> zaznacz
          przełącznik przy strefie i wybierz rośliny (tylko te już wcześniej
          przypisane do tej strefy) -> **Zapisz**. Strefa od razu przechodzi na
          stadium "Kiełkowanie", potem automatycznie "Młode rośliny", aż wróci
          do standardu. Przełącznik zawsze pokazuje realny stan strefy -
          wyłączenie go dla strefy z trwającą dosiewką **anuluje ją** i od razu
          wraca do standardu. UWAGA: HA nie pozwala linkować bezpośrednio do
          konkretnego kroku kreatora - przycisk otwiera tylko listę integracji,
          "Konfiguruj" i wybór "Dosiewka / nowe nasadzenie" trzeba kliknąć
          ręcznie za każdym razem.


          **Alternatywnie** (np. w automatyzacjach) - usługi wywoływane przez
          **Narzędzia deweloperskie -> Akcje**:


          - `garden_irrigation.start_new_planting` - pola: `zone_id` (numer
          strefy) i `plant_keys` (lista roślin z tych już przypisanych do tej
          strefy)

          - `garden_irrigation.cancel_new_planting` - pole: `zone_id` - ręczne,
          natychmiastowe zakończenie stadium wzrostu (np. pomyłka przy
          wyborze roślin)


          Status widać na żywo w sensorze "Stadium wzrostu" powyżej, w każdej
          karcie strefy.

